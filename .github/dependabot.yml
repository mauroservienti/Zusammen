version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
    # Peer dependency ranges are deliberately broad; only bump what we build and test with
    versioning-strategy: increase-if-necessary
    # Pinned majors, also listed in the README's "Pinned dependencies"; minor and patch updates still come through
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet: https://github.com/mauroservienti/Zusammen/issues/7
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types of the oldest supported Node.js version (22), so code can't use newer APIs
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directories:
      - /dotnet/src/Zusammen.NServiceBus
      - /dotnet/test/Zusammen.NServiceBus.Tests
      - /dotnet/compat/Zusammen.Compat.Endpoint
      - /samples/node-to-nservicebus/Billing
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
