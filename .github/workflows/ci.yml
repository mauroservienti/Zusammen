name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the full CI before publishing
  workflow_call:

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # NServiceBus compatibility tests run a .NET endpoint
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # MongoDB 8 refuses to start on Linux 6.19+ (https://jira.mongodb.org/browse/SERVER-121912) and runners vary.
      # Fall back to MongoDB 7 only when MongoDB 8 fails with that error, so the fallback ends once it's fixed.
      - name: Choose the MongoDB image
        run: |
          image=mongo:8
          docker run -d --name mongo-probe mongo:8 > /dev/null
          for _ in $(seq 60); do
            logs=$(docker logs mongo-probe 2>&1)
            if grep -q 'Waiting for connections' <<< "$logs"; then break; fi
            if grep -q 'SERVER-121912' <<< "$logs"; then
              image=mongo:7
              echo "::warning title=Not testing with MongoDB 8::MongoDB 8 can't start on Linux $(uname -r) (SERVER-121912); testing with MongoDB 7 instead"
              break
            fi
            sleep 1
          done
          docker rm -f mongo-probe > /dev/null
          echo "Linux $(uname -r): testing with $image"
          echo "ZUSAMMEN_MONGODB_IMAGE=$image" >> "$GITHUB_ENV"
      - run: pnpm test
        env:
          ZUSAMMEN_REQUIRE_DOTNET: 'true'

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build dotnet/Zusammen.NServiceBus.slnx -c Release
      - run: dotnet test dotnet/Zusammen.NServiceBus.slnx -c Release --no-build
      - run: dotnet build samples/node-to-nservicebus/Billing -c Release
