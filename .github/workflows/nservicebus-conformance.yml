name: NServiceBus conformance drift

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - docs/nservicebus-conformance.md
      - scripts/check-nservicebus-conformance.mjs
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-nservicebus-conformance.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
