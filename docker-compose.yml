# Local development dependencies. Tests use Testcontainers and don't need these running.
services:
  mongodb:
    # MongoDB 8 doesn't start on Linux 6.19+ (SERVER-121912): set ZUSAMMEN_MONGODB_IMAGE=mongo:7 there
    image: ${ZUSAMMEN_MONGODB_IMAGE:-mongo:8}
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      # Initiates the single-node replica set on first run; transactions require a replica set
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  postgresql:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 10
